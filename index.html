<style>

.q{margin-bottom:8px;color:#C9682A}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{font:inherit;font-size:14px;border:3px solid var(--wood);background:#fff;color:var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer;box-shadow:0 3px 0 rgba(120,80,30,.25)}
.opts button:hover,.opts button:focus-visible{background:#FFF1CC;outline:none}
.opts button.ok{background:#BDEBA9;border-color:#5FBF7F}
.opts button.no{background:#FFD3C2;border-color:var(--or)}
#fb{margin-top:10px;font-size:14px;min-height:1.2em;font-weight:500}
#x{position:absolute;right:14px;top:10px;border:0;background:none;font-size:24px;cursor:pointer;color:var(--ink);z-index:1}
@media (max-width:600px){.title b{font-size:20px}#score{top:76px;right:auto;left:14px}}

#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

.pill.done{border-color:var(--leaf)}
.pill b{margin-right:5px;font-weight:400}
#hint{position:absolute;left:50%;top:78px;transform:translateX(-50%);background:rgba(255,250,236,.85);border-radius:999px;padding:5px 14px;font-size:12px;z-index:2;pointer-events:none}

#err{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:9}

D.slice(1).forEach(d=>{const dir=new THREE.Vector3(d.wx,0,d.wz).normalize(),L=1.4,mid=2.4;

 [-1,1].forEach(s=>{const e=mk(new THREE.ConeGeometry(.17,.34,4),s<0?O:B,s*.29,1.44,.02,inner);e.rotation.z=-s*.3;e.rotation.y=Math.PI/4;

 const tg=new THREE.Group();inner.add(tg);

const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
cv.addEventListener("pointerup",e=>{ptrs.delete(e.pointerId);cv.classList.remove("drag");
 if(moved<6){mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,camera);
  const hit=ray.intersectObjects(Object.values(islG),true)[0];if(hit){let o=hit.object;while(o&&o.userData.id===undefined)o=o.parent;if(o)go(D[o.userData.id])}}});
cv.addEventListener("pointercancel",e=>{ptrs.delete(e.pointerId);cv.classList.remove("drag")});
cv.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(.6,Math.min(1.4,zoom*(1+e.deltaY*.001)));lastI=performance.now()},{passive:false});
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const clock=new THREE.Clock();let on=-1;const v3=new THREE.Vector3();
function frame(){
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime,now=performance.now();
 amp+=((now-lastI>5000&&!reduce?1:0)-amp)*.03;
 const a=az+Math.sin(t*.25)*.12*amp,asp=innerWidth/innerHeight,rad=17*zoom*Math.max(1,1.6/asp);
 camera.position.set(Math.sin(pol)*Math.sin(a)*rad,Math.cos(pol)*rad,Math.sin(pol)*Math.cos(a)*rad);camera.lookAt(0,.4,0);
 // water waves
 const pa=wg.attributes.position;for(let i=0;i<pa.count;i++){const x=wbase[i*3],z=wbase[i*3+2];pa.setY(i,Math.sin(x*.5+t*1.2)*.07+Math.cos(z*.45+t)*.07)}pa.needsUpdate=true;
 foams.forEach((f,i)=>{const s=1+Math.sin(t*1.3+i)*.03;f.scale.set(s,s,s);f.material.opacity=.42+Math.sin(t*1.3+i)*.12});
 clouds.forEach((c,i)=>{c.position.x+=Math.sin(t*.1+i)*.003});
 trees.forEach((tg,i)=>{tg.rotation.z=Math.sin(t*1.5+i)*.03});
 Object.keys(islG).forEach(k=>{const g=islG[k],tgt=(+k===on?.18:0)+Math.sin(t*1.1+ +k)*.04;g.position.y+=(tgt-g.position.y)*.1});
 // cat
 const ud=cat.userData;let moving=false;
 let kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,kz=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y;
 const kl=Math.hypot(kx,kz);
 if(kl>.12){path=[];if(kl>1){kx/=kl;kz/=kl}
  const fx=-Math.sin(a),fz=-Math.cos(a),rx=Math.cos(a),rz=-Math.sin(a);
  const mx=(fx*kz+rx*kx)*3.4*dt,mz=(fz*kz+rz*kx)*3.4*dt,px=cat.position.x,pz=cat.position.z;
  let nx=px,nz=pz;
  if(walkable(px+mx,pz+mz)){nx=px+mx;nz=pz+mz}else if(walkable(px+mx,pz)){nx=px+mx}else if(walkable(px,pz+mz)){nz=pz+mz}
  if(nx!==px||nz!==pz){cat.position.x=nx;cat.position.z=nz;moving=true;const ty=Math.atan2(mx,mz);let df=ty-facing;df=Math.atan2(Math.sin(df),Math.cos(df));facing+=df*.25;cat.rotation.y=facing}}
 else if(path.length>seg+1){const B=path[seg+1];v3.copy(B).sub(cat.position).setY(0);const step=3.4*dt;
  if(v3.length()<=step){cat.position.x=B.x;cat.position.z=B.z;seg++;if(path.length<=seg+1)path=[]}
  else{v3.normalize();cat.position.x+=v3.x*step;cat.position.z+=v3.z*step;const ty=Math.atan2(v3.x,v3.z);let df=ty-facing;df=Math.atan2(Math.sin(df),Math.cos(df));facing+=df*.2;cat.rotation.y=facing;moving=true}}
 if(moving){cat.position.y=.08+Math.abs(Math.sin(t*13))*.22;ud.inner.rotation.z=Math.sin(t*13)*.07;ud.tg.rotation.y=Math.sin(t*14)*.4}
 else{cat.position.y=.08+Math.max(0,Math.sin(t*2))*.03;ud.inner.rotation.z=0;ud.tg.rotation.y=Math.sin(t*2.2)*.25;ud.inner.scale.y=1+Math.sin(t*2)*.015;
  const ty=Math.atan2(camera.position.x-cat.position.x,camera.position.z-cat.position.z);let df=ty-facing;df=Math.atan2(Math.sin(df),Math.cos(df));facing+=df*.04;cat.rotation.y=facing}
 // which island is the cat on
 let det=-1;for(const d of D)if(Math.hypot(cat.position.x-d.wx,cat.position.z-d.wz)<d.r-.15){det=d.id;break}
 if(det>=0)here=det;
 if(path.length){lastIsl=-2}else if(det!==lastIsl){lastIsl=det;if(det>=0){if(shownId!==det)openIsl(D[det])}else if(shownId>=0)closePanel()}
 // labels
 const W=innerWidth,H=innerHeight;
 D.forEach(d=>{v3.set(d.wx,2.35+islG[d.id].position.y,d.wz).project(camera);const e=pills[d.id];e.style.left=(v3.x*.5+.5)*W+"px";e.style.top=(-v3.y*.5+.5)*H+"px";e.style.zIndex=Math.round((1-v3.z)*1000)});
 renderer.render(scene,camera);requestAnimationFrame(frame)}
frame();
window.__setOn=i=>{on=i};window.__walk=walkTo;
}
function openIsl(d){
 shownId=d.id;Object.values(pills).forEach(p=>p.classList.remove("on"));pills[d.id].classList.add("on");
 if(window.__setOn)window.__setOn(d.id);
 pt.innerHTML=`<i>${IC[d.id]}</i>${d.t}`;pp.textContent=d.p;pq.textContent=d.q||"";po.innerHTML="";fb.textContent="";
 (d.o||[]).forEach((txt,i)=>{const b=document.createElement("button");b.textContent=txt;b.onclick=()=>{
  [...po.children].forEach(x=>x.classList.remove("ok","no"));
  if(i===d.a){b.classList.add("ok");fb.textContent="答對了!"+d.e;done.add(d.id);pills[d.id].classList.add("done");document.getElementById("score").textContent=`🍎 已通關 ${done.size} / ${total}`;if(done.size===total)fb.textContent+=" 🎉 你已走遍健康島,成為聰明的健保使用者!"}
  else{b.classList.add("no");fb.textContent="再想想看。"}};po.appendChild(b)});
 panel.classList.remove("hide");
}
function closePanel(){panel.classList.add("hide");shownId=-1;Object.values(pills).forEach(p=>p.classList.remove("on"));if(window.__setOn)window.__setOn(-1)}
window.go=function(d){if(window.__walk)window.__walk(d);openIsl(d)};
document.getElementById("x").onclick=closePanel;
// on-screen joystick (touch)
const joyEl=document.getElementById("joy"),knob=document.getElementById("knob");
if("ontouchstart" in window||navigator.maxTouchPoints>0)joyEl.style.display="block";
let jp=null;
const jmove=e=>{const r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.min(1,Math.hypot(dx,dy)/45),an=Math.atan2(dy,dx);
 joy.x=Math.cos(an)*m;joy.y=Math.sin(an)*m;knob.style.transform=`translate(${Math.cos(an)*m*38}px,${Math.sin(an)*m*38}px)`};
joyEl.addEventListener("pointerdown",e=>{jp=e.pointerId;joyEl.setPointerCapture(jp);jmove(e)});
joyEl.addEventListener("pointermove",e=>{if(e.pointerId===jp)jmove(e)});
const jend=e=>{if(e.pointerId===jp){jp=null;joy.x=joy.y=0;knob.style.transform=""}};
joyEl.addEventListener("pointerup",jend);joyEl.addEventListener("pointercancel",jend);
</script>
